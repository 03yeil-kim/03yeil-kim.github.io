<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BITE — Mobile Interaction Prototype</title>
  <style>
    :root {
      --ink: #20282b;
      --ink-soft: #657071;
      --paper: #f5f5f0;
      --paper-deep: #e9ebe6;
      --surface: #fffdfa;
      --navy: #1d2b32;
      --coral: #df7e67;
      --coral-soft: #f2d9cf;
      --sage: #a8bcae;
      --line: rgba(32, 40, 43, .12);
      --shadow: 0 26px 70px rgba(32, 40, 43, .13);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background: #eef2f3;
      font-family: Inter, Pretendard, "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    button { border: 0; font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid rgba(223, 126, 103, .5); outline-offset: 3px; }

    .preview-shell {
      width: min(100%, 790px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 26px 26px 74px;
      border-left: 1px solid rgba(32, 40, 43, .18);
      border-right: 1px solid rgba(32, 40, 43, .18);
      background: linear-gradient(160deg, #eef5f5, #f5f4f0 58%, #ecf0f1);
    }
    .preview-header {
      min-height: 73px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border: 1px solid rgba(32, 40, 43, .2);
      border-bottom: 0;
      color: #788383;
      letter-spacing: .14em;
      font-size: 12px;
    }
    .preview-header strong { font-weight: 500; }
    .preview-tabs { display: flex; align-items: stretch; gap: 22px; height: 73px; }
    .preview-tabs span { display: grid; place-items: center; position: relative; }
    .preview-tabs .active { color: #3d5d99; }
    .preview-tabs .active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #3d5d99; }
    .preview-body {
      min-height: calc(100vh - 125px);
      padding: 36px 44px 94px;
      border: 1px solid rgba(32, 40, 43, .2);
      background: rgba(247, 250, 250, .64);
    }
    .device-frame {
      width: min(100%, 580px);
      height: min(850px, calc(100vh - 180px));
      min-height: 660px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(32, 40, 43, .14);
      border-radius: 40px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .app-scroll { height: 100%; overflow: auto; scrollbar-width: thin; scrollbar-color: #7f8582 transparent; }
    .app-scroll::-webkit-scrollbar { width: 9px; }
    .app-scroll::-webkit-scrollbar-thumb { background: #7f8582; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
    .app { min-height: 100%; background: radial-gradient(circle at 15% 0, rgba(222, 216, 195, .32), transparent 350px), var(--paper); }
    .app-topbar { min-height: 82px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: .16em; }
    .brand-dot { width: 10px; height: 10px; display: inline-block; background: var(--coral); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
    .avatar { width: 37px; height: 37px; display: grid; place-items: center; border-radius: 50%; background: var(--navy); color: #fffdfa; font-weight: 700; font-size: 12px; }
    .content { max-width: 460px; margin: 0 auto; padding: 42px 30px 112px; }
    .eyebrow { margin: 0 0 10px; color: var(--ink-soft); font-size: 10px; letter-spacing: .16em; font-weight: 800; }
    .hero { display: flex; align-items: end; justify-content: space-between; margin-bottom: 28px; }
    h1, h2, p { margin-top: 0; }
    .hero h1 { margin-bottom: 0; font-size: 42px; line-height: .98; letter-spacing: -.07em; font-weight: 500; }
    .hero h1 em { color: var(--coral); font-style: normal; }
    .time { color: var(--ink-soft); font-size: 11px; }
    .context-switcher { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-bottom: 47px; padding: 5px; border-radius: 17px; background: rgba(32, 40, 43, .07); }
    .context-tab { min-height: 70px; display: flex; align-items: center; gap: 11px; padding: 10px 12px; text-align: left; border-radius: 13px; background: transparent; color: var(--ink-soft); transition: .2s var(--ease); }
    .context-tab.active { color: var(--ink); background: var(--surface); box-shadow: 0 6px 18px rgba(32,40,43,.08); }
    .context-tab:hover { transform: translateY(-1px); }
    .context-icon { width: 29px; height: 29px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--coral-soft); color: var(--coral); }
    .context-tab:nth-child(2) .context-icon { background: #dbe6df; color: #5a7a68; }
    .context-tab strong, .context-tab small { display: block; }
    .context-tab strong { margin-bottom: 4px; font-size: 12px; }
    .context-tab small { font-size: 10px; color: var(--ink-soft); }
    .section-row { display: flex; align-items: end; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
    .section-row h2 { margin-bottom: 0; font-size: 19px; letter-spacing: -.05em; }
    .text-action { padding: 5px 0; background: transparent; color: var(--ink-soft); font-size: 11px; }
    .text-action:hover { color: var(--coral); }
    .recommendation { overflow: hidden; border-radius: 22px; background: var(--surface); box-shadow: 0 18px 42px rgba(32,40,43,.1); animation: enter .45s var(--ease) both; }
    .visual { min-height: 248px; position: relative; overflow: hidden; background: linear-gradient(145deg, #d49d7d, #c7ae91 50%, #e3c5a3); }
    .visual.sage { background: linear-gradient(145deg, #9eb7a5, #ced3b9 54%, #e7d3b3); }
    .visual.navy { background: linear-gradient(145deg, #334e66, #71859a 52%, #c8b99f); }
    .visual.coral { background: linear-gradient(145deg, #c66d61, #df9f7f 54%, #e9cda4); }
    .orbit { position: absolute; border: 1px solid rgba(255,255,255,.46); border-radius: 50%; transform: rotate(-23deg); }
    .orbit.one { width: 390px; height: 180px; left: -100px; top: 43px; }
    .orbit.two { width: 370px; height: 150px; right: -130px; bottom: 28px; border-color: rgba(255,255,255,.3); }
    .window { position: absolute; top: 55px; right: 22%; width: 118px; height: 150px; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; border: 1px solid rgba(255,255,255,.45); background: rgba(255,255,255,.14); color: rgba(255,255,255,.93); backdrop-filter: blur(12px); transform: rotate(7deg); box-shadow: 0 16px 27px rgba(32,40,43,.12); }
    .window span { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
    .window strong { font-size: 25px; letter-spacing: -.08em; }
    .grain { position: absolute; inset: 0; opacity: .16; background-image: radial-gradient(rgba(255,255,255,.8) .7px, transparent .7px); background-size: 6px 6px; mix-blend-mode: soft-light; }
    .recommendation-copy { padding: 24px; }
    .tags { display: flex; gap: 6px; margin-bottom: 16px; }
    .tag { padding: 6px 9px; border-radius: 15px; font-size: 9px; font-weight: 800; }
    .tag.primary { color: #9a5545; background: var(--coral-soft); }
    .tag.secondary { color: var(--ink-soft); background: rgba(32,40,43,.06); }
    .recommendation-copy h2 { margin-bottom: 9px; font-size: 29px; letter-spacing: -.07em; }
    .recommendation-copy p { margin-bottom: 18px; color: var(--ink-soft); font-size: 12px; line-height: 1.6; }
    .reason { display: flex; gap: 7px; align-items: center; margin-bottom: 20px; color: #986152; font-size: 10px; }
    .actions { display: flex; gap: 8px; }
    .play-cta, .save-btn { min-height: 43px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    .play-cta { flex: 1; background: var(--navy); color: #fffdfa; }
    .save-btn { min-width: 76px; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); }
    .save-btn.saved { color: #9a5545; background: var(--coral-soft); border-color: transparent; }
    .continue { margin-top: 44px; }
    .continue-card, .quick-card { width: 100%; display: flex; align-items: center; gap: 11px; padding: 8px; border: 1px solid rgba(32,40,43,.08); border-radius: 15px; background: var(--surface); text-align: left; box-shadow: 0 8px 20px rgba(32,40,43,.04); }
    .mini-visual { width: 69px; height: 62px; position: relative; overflow: hidden; flex: 0 0 auto; border-radius: 10px; background: linear-gradient(145deg, #d49d7d, #e4c39e); }
    .mini-visual .window { top: 15px; right: 12px; width: 31px; height: 31px; padding: 4px; }
    .mini-visual .window span { display: none; }
    .mini-visual .window strong { font-size: 7px; }
    .row-copy { flex: 1; min-width: 0; }
    .row-copy strong, .row-copy span { display: block; }
    .row-copy strong { margin-bottom: 5px; font-size: 12px; }
    .row-copy span { color: var(--ink-soft); font-size: 10px; }
    .progress { height: 4px; overflow: hidden; margin-top: 9px; border-radius: 4px; background: rgba(32,40,43,.08); }
    .progress i { display: block; height: 100%; width: 34%; background: var(--coral); }
    .quick { margin-top: 40px; }
    .quick-grid { display: grid; gap: 9px; }
    .quick-card { min-height: 76px; }
    .quick-card .mini-visual { width: 63px; height: 58px; }
    .play-dot { color: var(--coral); }
    .bottom-nav { position: fixed; z-index: 4; left: 50%; bottom: max(17px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 4px; width: min(410px, calc(100% - 34px)); padding: 5px; border: 1px solid rgba(32,40,43,.09); border-radius: 17px; background: rgba(255,253,250,.88); box-shadow: 0 12px 28px rgba(32,40,43,.14); backdrop-filter: blur(15px); }
    .nav-btn { flex: 1; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 12px; background: transparent; color: var(--ink-soft); font-size: 11px; }
    .nav-btn.active { color: #fffdfa; background: var(--navy); }
    .toast { position: fixed; z-index: 10; left: 50%; bottom: 80px; transform: translateX(-50%); padding: 11px 14px; border-radius: 11px; background: var(--navy); color: #fffdfa; font-size: 11px; white-space: nowrap; animation: toast-in .24s var(--ease) both; }

    .player-view, .profile-view { min-height: 100%; background: var(--navy); color: #f8f5ef; }
    .player-view { padding-bottom: 50px; }
    .player-top { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .player-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: transparent; color: #f8f5ef; font-size: 22px; }
    .player-label { color: rgba(248,245,239,.6); font-size: 10px; letter-spacing: .14em; }
    .player-stage { min-height: 430px; display: flex; flex-direction: column; gap: 15px; position: relative; overflow: hidden; padding: 18px 18px 19px; background: #1d2b32; text-align: left; touch-action: pan-y; }
    .player-stage > .visual { min-height: 0; height: 250px; flex: 0 0 250px; border-radius: 22px; }
    .stage-copy { position: static; display: flex; flex-direction: column; gap: 5px; z-index: 2; text-shadow: 0 2px 14px rgba(0,0,0,.3); }
    .stage-copy span { color: rgba(255,255,255,.7); font-size: 9px; letter-spacing: .14em; }
    .stage-copy strong { font-size: 24px; letter-spacing: -.06em; }
    .play-disc { position: absolute; z-index: 2; top: 112px; left: 50%; transform: translateX(-50%); width: 62px; height: 62px; display: grid; place-items: center; border-radius: 50%; background: rgba(29,43,50,.75); color: #fffdfa; font-size: 25px; }
    .gesture-hint { position: static; z-index: 2; align-self: flex-end; padding: 6px 8px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; background: rgba(255,255,255,.06); color: rgba(255,255,255,.55); font-size: 8px; }
    .player-copy { padding: 25px 24px 0; }
    .player-copy h1 { margin-bottom: 8px; font-size: 28px; letter-spacing: -.07em; }
    .player-copy p { margin-bottom: 0; color: rgba(248,245,239,.62); font-size: 12px; line-height: 1.6; }
    .player-progress { margin-top: 25px; }
    .player-progress .progress { height: 4px; background: rgba(255,255,255,.15); }
    .player-progress .progress i { width: 34%; }
    .progress-meta { display: flex; justify-content: space-between; margin-top: 8px; color: rgba(255,255,255,.45); font-size: 9px; }
    .player-controls { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 19px 0 24px; }
    .control, .main-play { width: 41px; height: 41px; display: grid; place-items: center; border-radius: 50%; background: transparent; color: rgba(255,255,255,.76); font-size: 18px; }
    .main-play { width: 56px; height: 56px; background: #fffdfa; color: var(--navy); font-size: 23px; }
    .player-support { margin-top: 4px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); }
    .support-header { display: flex; justify-content: space-between; margin-bottom: 9px; color: rgba(255,255,255,.5); font-size: 8px; letter-spacing: .14em; }
    .support-progress { height: 3px; overflow: hidden; margin-bottom: 13px; border-radius: 3px; background: rgba(255,255,255,.14); }
    .support-progress i { display: block; height: 100%; background: var(--coral); }
    .support-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .support-row strong, .support-row span { display: block; }
    .support-row strong { margin-bottom: 5px; font-size: 13px; }
    .support-row span { color: rgba(255,255,255,.56); font-size: 10px; }
    .support-action { min-height: 36px; padding: 0 12px; border: 1px solid rgba(255,255,255,.22); border-radius: 10px; background: transparent; color: #fffdfa; font-size: 10px; }
    .support-action:hover { border-color: var(--coral); color: #ffd9cc; }

    .profile-view { min-height: 100%; padding-bottom: 100px; background: var(--paper); color: var(--ink); }
    .profile-top { height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .profile-content { padding: 50px 30px 0; }
    .profile-head { display: flex; align-items: center; gap: 16px; }
    .profile-avatar { width: 68px; height: 68px; display: grid; place-items: center; border-radius: 50%; background: var(--navy); color: #fffdfa; font-size: 22px; font-weight: 700; }
    .profile-head h1 { margin-bottom: 6px; font-size: 28px; letter-spacing: -.07em; }
    .profile-head p { margin-bottom: 0; color: var(--ink-soft); font-size: 11px; }
    .streak { margin-top: 40px; padding: 20px; border-radius: 17px; background: var(--navy); color: #fffdfa; }
    .streak small { color: rgba(255,255,255,.5); font-size: 9px; letter-spacing: .13em; }
    .streak strong { display: block; margin: 8px 0 5px; font-size: 33px; }
    .streak p { margin: 0; color: rgba(255,255,255,.58); font-size: 10px; }
    .profile-section { margin-top: 38px; }
    .profile-section h2 { margin-bottom: 13px; font-size: 18px; letter-spacing: -.05em; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { padding: 9px 11px; border: 1px solid var(--line); border-radius: 18px; color: var(--ink-soft); font-size: 10px; }
    .chip.active { border-color: transparent; background: var(--coral-soft); color: #9a5545; }
    .saved-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); text-align: left; }
    .saved-row + .saved-row { margin-top: 8px; }
    .saved-row .mini-visual { width: 61px; height: 54px; }
    .saved-row strong, .saved-row span { display: block; }
    .saved-row strong { margin-bottom: 4px; font-size: 11px; }
    .saved-row span { color: var(--ink-soft); font-size: 9px; }

    .hidden { display: none !important; }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @media (max-width: 560px) {
      .preview-shell { padding: 0 0 65px; border: 0; }
      .preview-header { padding: 0 17px; border-left: 0; border-right: 0; }
      .preview-body { padding: 25px 12px 75px; border-left: 0; border-right: 0; }
      .device-frame { width: min(100%, 430px); height: calc(100vh - 140px); min-height: 650px; border-radius: 30px; }
      .preview-tabs { gap: 12px; }
      .content { padding-left: 22px; padding-right: 22px; }
    }

    /* Portfolio case-study composition */
    .portfolio-page { width: min(100%, 1540px); margin: 0 auto; padding: 20px 48px 90px; }
    .site-header { min-height: 60px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(32,40,43,.2); color: #647177; font-size: 11px; letter-spacing: .16em; }
    .site-logo { color: #172d46; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; letter-spacing: -.07em; }
    .site-logo span { color: #4778d2; }
    .site-nav { display: flex; align-items: center; gap: 34px; }
    .portfolio-grid { display: grid; grid-template-columns: minmax(340px, .82fr) minmax(720px, 1.58fr); gap: 54px; align-items: start; padding-top: 28px; }
    .work-copy { min-height: 720px; display: flex; flex-direction: column; justify-content: center; padding: 0 0 0 78px; position: relative; }
    .work-copy::before { content: ""; position: absolute; left: 26px; top: 72px; bottom: 72px; width: 1px; background: rgba(32,40,43,.2); }
    .work-index { display: flex; justify-content: space-between; max-width: 370px; margin-bottom: 42px; color: #68767d; font-size: 11px; letter-spacing: .16em; }
    .playing { color: #6b88be; }
    .playing::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: #6096ef; }
    .work-kicker { margin: 0 0 14px; color: #4778d2; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-style: italic; }
    .work-copy h1 { margin: 0; color: #18314e; font-family: Georgia, "Times New Roman", serif; font-size: clamp(58px, 6vw, 104px); line-height: .87; letter-spacing: -.08em; font-weight: 500; }
    .work-summary { max-width: 390px; margin: 33px 0 35px; color: #5f6e76; font-size: 15px; line-height: 1.8; }
    .work-meta { display: flex; justify-content: space-between; max-width: 390px; padding: 13px 0; border-top: 1px solid rgba(32,40,43,.18); border-bottom: 1px solid rgba(32,40,43,.18); color: #71808a; font-size: 10px; letter-spacing: .13em; }
    .work-actions { display: grid; gap: 10px; max-width: 390px; margin-top: 28px; }
    .portfolio-cta, .portfolio-link { min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 3px; font-size: 13px; letter-spacing: .02em; }
    .portfolio-cta { background: #2f6be1; color: white; }
    .portfolio-link { border: 1px solid #6f94d5; background: transparent; color: #4f70a2; }
    .portfolio-cta:hover { background: #245bca; }
    .portfolio-link:hover { background: rgba(111,148,213,.08); }
    .preview-shell { width: 100%; min-height: 0; margin: 0; padding: 0; border: 0; background: transparent; }
    .preview-body { min-height: 760px; display: grid; grid-template-columns: minmax(280px, 1fr) minmax(220px, .72fr); gap: 38px; align-items: center; padding: 44px; border: 1px solid rgba(32,40,43,.2); background: rgba(247,250,250,.64); }
    .device-frame { width: min(100%, 380px); height: 650px; min-height: 0; margin: 0 auto; border-radius: 34px; }
    .preview-notes { max-width: 320px; color: #63737d; }
    .preview-notes h2 { margin: 0 0 14px; color: #223b58; font-family: Georgia, "Times New Roman", serif; font-size: 31px; line-height: 1.05; letter-spacing: -.06em; font-weight: 500; }
    .preview-notes > p { margin: 0 0 27px; font-size: 13px; line-height: 1.7; }
    .flow-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .flow-list li { display: grid; grid-template-columns: 33px 1fr; gap: 10px; align-items: center; min-height: 45px; padding: 0 12px; border: 1px solid rgba(76,122,205,.22); border-radius: 4px; color: #4f6d9d; font-size: 12px; }
    .flow-list li strong { color: #527dd0; font-size: 11px; }
    .interaction-notes { display: grid; grid-template-columns: .8fr 1.6fr; gap: 60px; margin: 28px 0 0; padding: 28px 0 0 78px; border-top: 1px solid rgba(32,40,43,.2); }
    .interaction-notes h2 { margin: 0; color: #18314e; font-family: Georgia, "Times New Roman", serif; font-size: 32px; font-weight: 500; letter-spacing: -.06em; }
    .interaction-notes p { margin: 0; color: #65747b; font-size: 13px; line-height: 1.8; }
    .note-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 19px; }
    .note-card { padding: 14px; border: 1px solid rgba(76,122,205,.18); border-radius: 4px; background: rgba(255,255,255,.54); }
    .note-card strong, .note-card span { display: block; }
    .note-card strong { margin-bottom: 8px; color: #4f70a2; font-size: 11px; }
    .note-card span { color: #65747b; font-size: 11px; line-height: 1.6; }
    @media (max-width: 1180px) {
      .portfolio-page { padding-left: 25px; padding-right: 25px; }
      .portfolio-grid { grid-template-columns: minmax(300px, .76fr) minmax(600px, 1.4fr); gap: 28px; }
      .work-copy { padding-left: 55px; }
      .interaction-notes { padding-left: 55px; }
    }
    @media (max-width: 900px) {
      .site-nav { gap: 14px; font-size: 9px; }
      .portfolio-grid { grid-template-columns: 1fr; }
      .work-copy { min-height: auto; padding: 55px 35px 35px 55px; }
      .work-copy::before { top: 55px; bottom: 35px; }
      .preview-body { min-height: 760px; }
    }
    @media (max-width: 620px) {
      .portfolio-page { padding: 0 0 55px; }
      .site-header { padding: 0 17px; }
      .site-logo { font-size: 19px; }
      .site-nav span:first-child, .site-nav span:nth-child(2) { display: none; }
      .work-copy { padding: 45px 24px 35px 54px; }
      .work-copy h1 { font-size: 66px; }
      .work-kicker { font-size: 18px; }
      .work-summary { font-size: 13px; }
      .preview-body { grid-template-columns: 1fr; gap: 34px; padding: 24px 16px 34px; }
      .device-frame { width: min(100%, 420px); height: 680px; }
      .preview-notes { max-width: none; padding: 0 10px; }
      .interaction-notes { grid-template-columns: 1fr; gap: 16px; margin: 20px 18px 0; padding: 24px 0 0; }
      .note-cards { grid-template-columns: 1fr; }
    }


    /* Mobile preview-only composition */
    .portfolio-page { width: min(100%, 790px); min-height: 100vh; margin: 0 auto; padding: 0 26px 66px; background: linear-gradient(160deg, #eef5f5, #f5f4f0 58%, #ecf0f1); }
    .site-header, .work-copy, .interaction-notes { display: none !important; }
    .portfolio-grid { display: block; padding: 0; }
    .preview-shell { width: 100%; min-height: 100vh; margin: 0; padding: 0; border: 0; background: transparent; }
    .preview-header { min-height: 73px; padding: 0 22px; border-left: 1px solid rgba(32,40,43,.2); border-right: 1px solid rgba(32,40,43,.2); }
    .preview-tabs .active { color: #3d6fca; }
    .preview-tabs .active::after { background: #3d6fca; }
    .preview-body { min-height: calc(100vh - 73px); display: block; padding: 20px 28px 72px; border: 1px solid rgba(32,40,43,.2); background: rgba(247,250,250,.64); }
    .device-frame { width: 100%; height: calc(100vh - 155px); min-height: 720px; margin: 0 auto; border-radius: 34px; }
    .preview-notes { display: none; }
    @media (max-width: 620px) {
      .portfolio-page { padding: 0 0 58px; }
      .preview-header { padding: 0 19px; border-left: 0; border-right: 0; }
      .preview-body { min-height: calc(100vh - 73px); padding: 19px 11px 60px; border-left: 0; border-right: 0; }
      .device-frame { width: 100%; height: calc(100vh - 128px); min-height: 700px; border-radius: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="preview-shell">
    <header class="preview-header">
      <strong>WORK PREVIEW</strong>
      <nav class="preview-tabs" aria-label="프로토타입 타입"><span class="active">MOBILE</span><span>INTERACTION</span></nav>
    </header>
    <section class="preview-body">
      <div class="device-frame">
        <div id="appScroll" class="app-scroll"></div>
      </div>
    </section>
  </main>
  <script>
    const contents = {
      meal: [
        { id: 1, title: '오늘의 작은 발견', subtitle: '우리가 매일 지나치는 장면 속 흥미로운 사실 하나', duration: '12분', category: '가볍게 보기', reason: '식사하는 동안 보기 좋은 12분', tone: '' },
        { id: 2, title: '느린 오후의 레시피', subtitle: '손이 바쁜 순간에도 따라갈 수 있는 작은 이야기', duration: '8분', category: '소리 없이도 좋아요', reason: '잠깐 화면을 놓쳐도 흐름이 보여요', tone: 'sage' },
        { id: 3, title: '한 장면, 한 문장', subtitle: '짧은 장면으로 만나는 오늘의 문장', duration: '6분', category: '짧게 끝내기', reason: '한 끼 전에 기분 좋게 끝나요', tone: 'navy' }
      ],
      move: [
        { id: 4, title: '도시의 다음 정거장', subtitle: '창밖 풍경과 함께 이어지는 도시의 작은 이야기', duration: '18분', category: '이어보기 좋아요', reason: '중간에 멈춰도 다음에 이어볼 수 있어요', tone: 'navy' },
        { id: 5, title: '출근길 플레이리스트', subtitle: '오늘의 이동 속도에 맞춘 세 가지 짧은 이야기', duration: '20분', category: '출퇴근 20분', reason: '출퇴근 20분에 잘 맞아요', tone: 'coral' },
        { id: 6, title: '여기서 잠깐', subtitle: '한 정거장 안에 끝나는 짧고 선명한 에피소드', duration: '7분', category: '한 정거장', reason: '한 정거장 동안 가볍게 보기 좋아요', tone: 'sage' }
      ]
    };

    let state = { screen: 'home', context: 'meal', index: 0, saved: new Set([4]), progress: 34, playing: false, showNext: false, muted: false };
    let toastTimer;
    let touchStart = null;

    const appScroll = document.getElementById('appScroll');
    const active = () => contents[state.context][state.index % contents[state.context].length];
    const next = () => contents[state.context][(state.index + 1) % contents[state.context].length];
    const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));

    function visual(item, mini = false) {
      return `<div class="${mini ? 'mini-visual' : 'visual'} ${item.tone}"><div class="orbit one"></div><div class="orbit two"></div><div class="window"><span>${esc(item.category)}</span><strong>${esc(item.duration)}</strong></div><div class="grain"></div></div>`;
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      const old = document.querySelector('.toast');
      if (old) old.remove();
      const node = document.createElement('div');
      node.className = 'toast';
      node.textContent = message;
      document.body.appendChild(node);
      toastTimer = setTimeout(() => node.remove(), 2100);
    }

    function nav() {
      return `<nav class="bottom-nav" aria-label="주요 메뉴"><button class="nav-btn ${state.screen === 'home' ? 'active' : ''}" data-action="home">⌂ <span>홈</span></button><button class="nav-btn ${state.screen === 'profile' ? 'active' : ''}" data-action="profile">● <span>프로필</span></button></nav>`;
    }

    function homeView() {
      const item = active();
      const isSaved = state.saved.has(item.id);
      return `<div class="app"><header class="app-topbar"><span class="brand"><i class="brand-dot"></i>BITE</span><span class="avatar">민</span></header><main class="content"><section class="hero"><div><p class="eyebrow">GOOD TO HAVE YOU HERE</p><h1>안녕하세요,<br><em>민지님</em></h1></div><span class="time">◷ 12:40</span></section><section class="context-switcher" id="contextSwitcher" aria-label="시청 상황 선택"><button class="context-tab ${state.context === 'meal' ? 'active' : ''}" data-context="meal"><i class="context-icon">◒</i><span><strong>식사시간</strong><small>가볍게 보기</small></span></button><button class="context-tab ${state.context === 'move' ? 'active' : ''}" data-context="move"><i class="context-icon">↗</i><span><strong>이동시간</strong><small>이어보기 좋아요</small></span></button></section><section><div class="section-row"><div><p class="eyebrow">JUST FOR NOW</p><h2>지금 이 순간, 한 입</h2></div><button class="text-action" data-action="other">다른 추천 ›</button></div><article class="recommendation">${visual(item)}<div class="recommendation-copy"><div class="tags"><span class="tag primary">${esc(item.category)}</span><span class="tag secondary">${esc(item.duration)}</span></div><h2>${esc(item.title)}</h2><p>${esc(item.subtitle)}</p><div class="reason">✧ <span>${esc(item.reason)}</span></div><div class="actions"><button class="play-cta" data-action="play">● 바로 재생</button><button class="save-btn ${isSaved ? 'saved' : ''}" data-action="save">${isSaved ? '✓ 저장됨' : '♡ 저장'}</button></div></div></article></section><section class="continue"><div class="section-row"><div><p class="eyebrow">KEEP GOING</p><h2>이어서 볼까요?</h2></div></div><button class="continue-card" data-action="play">${visual(item, true)}<span class="row-copy"><strong>${esc(item.title)}</strong><span>8분 남음 · 34% 봤어요</span><i class="progress"><i></i></i></span><span>›</span></button></section><section class="quick"><div class="section-row"><div><p class="eyebrow">LOW EFFORT, GOOD STORY</p><h2>오늘의 짧은 선택</h2></div><button class="text-action" data-action="other">전체 보기</button></div><div class="quick-grid">${contents[state.context].slice(1).map((entry, offset) => `<button class="quick-card" data-quick-index="${offset + 1}">${visual(entry, true)}<span class="row-copy"><strong>${esc(entry.title)}</strong><span>${esc(entry.duration)} · ${esc(entry.category)}</span></span><span class="play-dot">▶</span></button>`).join('')}</div></section></main>${nav()}</div>`;
    }

    function playerView() {
      const item = active();
      return `<div class="player-view"><header class="player-top"><button class="player-icon" data-action="home" aria-label="홈으로">←</button><span class="player-label">${state.context === 'meal' ? '식사시간' : '이동시간'}</span><button class="player-icon" data-action="save" aria-label="저장">${state.saved.has(item.id) ? '♥' : '♡'}</button></header><button class="player-stage" id="playerStage" aria-label="플레이어 컨트롤">${visual(item)}<div class="play-disc">${state.playing ? 'Ⅱ' : '▶'}</div><div class="stage-copy"><span>${esc(item.category)}</span><strong>${esc(item.title)}</strong></div><span class="gesture-hint">밀어서 탐색 · 아래로 닫기</span></button><main class="player-copy"><p class="eyebrow">BITE ORIGINAL · ${esc(item.duration)}</p><h1>${esc(item.title)}</h1><p>${esc(item.subtitle)}</p><div class="player-progress"><i class="progress"><i style="width:${state.progress}%"></i></i><div class="progress-meta"><span>${Math.round(state.progress / 10)}분 지남</span><span>${esc(item.duration)}</span></div></div><div class="player-controls"><button class="control" data-action="rewind">↶</button><button class="main-play" data-action="toggle-play">${state.playing ? 'Ⅱ' : '▶'}</button><button class="control" data-action="forward">↷</button><button class="control" data-action="mute">${state.muted ? '◌' : '◉'}</button></div>${state.showNext ? `<section class="player-support"><div class="support-header"><span>NEXT BITE</span><span>${esc(next().duration)}</span></div><div class="support-progress"><i style="width: 0%"></i></div><div class="support-row"><div><strong>다음 추천을 이어볼까요?</strong><span>${esc(next().reason)}</span></div><button class="support-action" data-action="next">다음 보기</button></div></section>` : `<section class="player-support"><div class="support-header"><span>CONTINUE FROM HERE</span><span>${state.progress}%</span></div><div class="support-progress"><i style="width: ${state.progress}%"></i></div><div class="support-row"><div><strong>여기서 이어볼 수 있어요</strong><span>${esc(item.reason)}</span></div><button class="support-action" data-action="restart">처음부터</button></div></section>`}</main></div>`;
    }

    function profileView() {
      const item = contents.move[0];
      return `<div class="profile-view"><header class="profile-top"><button class="player-icon" data-action="home">←</button><span class="brand"><i class="brand-dot"></i>BITE</span><button class="player-icon">⋯</button></header><main class="profile-content"><section class="profile-head"><div class="profile-avatar">민</div><div><p class="eyebrow">PROFILE</p><h1>민지님의 취향</h1><p>짧지만 선명한 이야기를 좋아해요.</p></div></section><section class="streak"><small>THIS WEEK</small><strong>4일</strong><p>가볍게 시작한 날들이 쌓이고 있어요.</p></section><section class="profile-section"><p class="eyebrow">PREFERENCES</p><h2>자주 보는 분위기</h2><div class="chips"><span class="chip active">가볍게</span><span class="chip">새로운 것</span><span class="chip">도시 이야기</span><span class="chip">소리 없이도 좋아요</span></div></section><section class="profile-section"><p class="eyebrow">SAVED</p><h2>저장한 콘텐츠</h2><button class="saved-row" data-action="saved-play">${visual(item, true)}<span><strong>${esc(item.title)}</strong><span>${esc(item.duration)} · ${esc(item.category)}</span></span><span>›</span></button></section></main>${nav()}</div>`;
    }

    function render() {
      appScroll.innerHTML = state.screen === 'home' ? homeView() : state.screen === 'player' ? playerView() : profileView();
      appScroll.scrollTop = 0;
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll('[data-context]').forEach((button) => button.addEventListener('click', () => { state.context = button.dataset.context; state.index = 0; state.progress = 0; state.screen = 'home'; render(); showToast(state.context === 'meal' ? '식사시간에 맞는 추천을 준비했어요' : '이동시간에 맞는 추천을 준비했어요'); }));
      document.querySelectorAll('[data-quick-index]').forEach((button) => button.addEventListener('click', () => { state.index = Number(button.dataset.quickIndex); state.screen = 'player'; state.showNext = false; render(); }));
      document.querySelectorAll('[data-action]').forEach((button) => button.addEventListener('click', () => {
        const action = button.dataset.action;
        if (action === 'home') { state.screen = 'home'; state.playing = false; state.showNext = false; render(); }
        if (action === 'profile') { state.screen = 'profile'; render(); }
        if (action === 'play' || action === 'saved-play') { state.screen = 'player'; state.playing = false; state.showNext = false; render(); }
        if (action === 'other') { state.index = (state.index + 1) % contents[state.context].length; render(); showToast('다음 추천을 준비했어요'); }
        if (action === 'save') { const id = active().id; state.saved.has(id) ? state.saved.delete(id) : state.saved.add(id); render(); showToast(state.saved.has(id) ? '저장했어요' : '저장에서 뺐어요'); }
        if (action === 'toggle-play') { state.playing = !state.playing; state.showNext = false; render(); }
        if (action === 'rewind') { state.progress = Math.max(0, state.progress - 8); render(); showToast('10초 되돌렸어요'); }
        if (action === 'forward') { state.progress = Math.min(100, state.progress + 8); render(); showToast('10초 앞으로 갔어요'); }
        if (action === 'mute') { state.muted = !state.muted; render(); showToast(state.muted ? '소리를 껐어요' : '소리를 켰어요'); }
        if (action === 'restart') { state.progress = 0; state.playing = true; render(); }
        if (action === 'next') { state.index = (state.index + 1) % contents[state.context].length; state.progress = 0; state.showNext = false; state.playing = false; render(); }
      }));

      const stage = document.getElementById('playerStage');
      if (stage) {
        stage.addEventListener('click', (event) => { if (event.detail === 1) { state.playing = !state.playing; render(); } });
        stage.addEventListener('dblclick', (event) => { const rect = stage.getBoundingClientRect(); state.progress = Math.max(0, Math.min(100, state.progress + (event.clientX - rect.left < rect.width / 2 ? -8 : 8))); render(); });
        stage.addEventListener('touchstart', (event) => { const point = event.touches[0]; touchStart = { x: point.clientX, y: point.clientY }; }, { passive: true });
        stage.addEventListener('touchend', (event) => { if (!touchStart) return; const point = event.changedTouches[0]; const dx = point.clientX - touchStart.x; const dy = point.clientY - touchStart.y; touchStart = null; if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 55) { if (dy > 0) { state.screen = 'home'; state.playing = false; } else { state.showNext = true; state.playing = false; } render(); return; } if (Math.abs(dx) > 55) { state.progress = Math.max(0, Math.min(100, state.progress + (dx > 0 ? -8 : 8))); render(); showToast(dx > 0 ? '10초 되돌렸어요' : '10초 앞으로 갔어요'); } }, { passive: true });
      }
    }

    render();
  </script>
</body>
</html>
