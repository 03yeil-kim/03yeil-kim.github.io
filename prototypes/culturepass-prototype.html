:root {
  color-scheme: light;
  --stage: #edf5f7;
  --stage-ink: #153447;
  --stage-blue: #3269d4;
}
html,
body {
  margin: 0;
  min-height: 0 !important;
  background: var(--stage);
  overflow-x: hidden;
}
body {
  font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial,
    sans-serif;
}
button,
a,
input {
  touch-action: manipulation;
}
button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid #3b78df;
  outline-offset: 3px;
}
.export-shell {
  width: 100%;
  color: var(--stage-ink);
  overflow: clip;
  border: 1px solid #c3cfd5;
  background: var(--stage);
}
.export-chromeless {
  border: 0;
}
.export-toolbar {
  display: flex;
  align-items: center;
  gap: 18px;
  min-height: 62px;
  padding: 0 24px;
  border-bottom: 1px solid #c3cfd5;
  background: var(--stage);
}
.export-kicker {
  font-size: 11px;
  letter-spacing: 2px;
  color: #708692;
}
.export-kicker small {
  font-size: 9px;
  letter-spacing: 1px;
  margin-left: 5px;
}
.export-tabs {
  display: flex;
  gap: 20px;
  margin-left: auto;
  align-self: stretch;
}
.export-tabs button {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  color: #7b8d99;
  min-height: 48px;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 10px 2px;
  cursor: pointer;
}
.export-tabs button[aria-selected="true"] {
  color: var(--stage-blue);
  border-color: var(--stage-blue);
}
.export-reset {
  display: flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: 0;
  color: #7b8d99;
  font-size: 11px;
  min-height: 44px;
  cursor: pointer;
}
.export-content {
  padding: 22px;
}
.export-caption {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  padding: 17px 24px;
  border-top: 1px solid #c3cfd5;
  font-size: 10px;
  color: #728993;
}
.export-caption a {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--stage-blue);
  min-height: 32px;
}
.export-desktop {
  border: 1px solid #e4e1ed;
  border-radius: 12px;
  overflow: clip;
  background: #fcfbff;
}
.export-mobile {
  width: 430px;
  max-width: 100%;
  margin: 0 auto;
  background: #fcfbff;
  box-shadow: 0 8px 32px #28435512;
  border: 1px solid #dbe2e9;
  border-radius: 18px;
  overflow: clip;
  min-height: 0 !important;
}
.export-shell .site-shell {
  min-height: 0 !important;
}
.export-shell .search-box,
.export-shell .mobile-version-link {
  display: none !important;
}
.export-shell .culture-logo {
  transform: none !important;
  line-height: 1;
}
.export-shell .culture-logo img {
  display: block;
  width: 150px;
  max-width: 100%;
  height: auto;
}
.export-shell .site-footer .culture-logo img {
  width: 150px;
}
.export-shell .mobile-frame .culture-logo img {
  width: 130px;
}
.export-shell .site-header {
  position: relative !important;
  top: auto !important;
}
.export-shell .site-header .header-inner {
  position: relative;
}
.export-shell .page-container {
  padding-bottom: 28px;
}
.export-shell .mobile-nav,
.export-shell .app-quick-menu {
  position: relative !important;
  left: auto !important;
  right: auto !important;
  bottom: auto !important;
  transform: none !important;
  width: 100% !important;
  max-width: none !important;
}
.export-shell .mobile-nav {
  border-radius: 0;
  border-top: 1px solid #e7e2ed;
  box-shadow: none;
  min-height: 72px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.export-shell .app-quick-menu {
  margin-top: 16px;
}
.export-shell .site-footer {
  margin-bottom: 0 !important;
}
.export-shell .header-prompt {
  display: none !important;
}
.export-header-back {
  display: none;
}
.mode-mobile.is-detail .export-header-back {
  display: inline-flex;
  position: absolute;
  left: 16px;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  color: #8d64bc;
}
.mode-mobile.is-detail .export-mobile .header-inner {
  justify-content: flex-end !important;
}
.mode-mobile.is-detail .export-mobile .header-inner > a {
  margin-left: auto;
}
.mode-mobile.is-detail .header-actions {
  display: none !important;
}
.mode-mobile.is-detail .detail-page > .back-link {
  display: none !important;
}
.workflow {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 42px;
  max-width: 1020px;
  margin: 0 auto;
  padding: 12px 0;
}
.workflow-phone {
  width: 390px !important;
  max-width: 100%;
  flex: 0 0 390px;
  background: #fff;
  min-height: 0 !important;
  overflow: clip;
  border: 1px solid #d6dfe5;
  border-radius: 24px;
  box-shadow: 0 14px 42px #203b4b0f;
}
.workflow-phone-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: #fff;
  padding: 12px 16px;
  border-bottom: 1px solid #f0ebf6;
}
.workflow-phone-header .icon-button {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  color: #8e67bb;
  background: none;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
}
.workflow-phone-header .culture-logo img {
  width: 130px;
}
.workflow-product {
  padding: 18px 16px 24px;
}
.workflow-product .detail-page > .back-link {
  display: none;
}
.workflow-product .detail-heading {
  margin-bottom: 20px;
}
.workflow-product .detail-heading h1 {
  font-size: 25px;
}
.workflow-selection {
  padding: 28px 22px 30px;
}
.workflow-selection h2 {
  font-size: 24px;
  color: #332540;
  margin: 10px 0;
}
.workflow-selection > p {
  font-size: 12px;
  color: #9c8caf;
  line-height: 1.8;
  margin-bottom: 24px;
}
.workflow-pick {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  padding: 20px 16px;
  margin: 12px 0;
  text-align: left;
  background: #faf7ff;
  border: 1px solid #eee7f9;
  border-radius: 14px;
  cursor: pointer;
  transition:
    background 0.15s,
    transform 0.15s;
}
.workflow-pick:hover {
  background: #efe7ff;
  transform: translateY(-2px);
}
.workflow-pick b {
  font-size: 18px;
  color: #463357;
}
.workflow-pick small {
  display: block;
  margin-top: 7px;
  color: #a18cb1;
  font-size: 11px;
}
.workflow-pick strong {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #8b5aca;
  font-size: 16px;
  white-space: nowrap;
}
.workflow-inspector {
  flex: 1;
  max-width: 340px;
  padding-top: 35px;
}
.workflow-inspector h2 {
  font-family: inherit;
  line-height: 1.5;
  font-size: 27px;
  margin: 18px 0 16px;
  font-weight: 750;
}
.workflow-inspector > p {
  font-size: 13px;
  color: #7b8e9a;
  line-height: 1.9;
}
.workflow-steps {
  display: grid;
  gap: 12px;
  margin-top: 28px;
}
.workflow-steps button {
  display: flex;
  align-items: center;
  gap: 22px;
  min-height: 56px;
  padding: 14px 20px;
  border: 1px solid #dce5ec;
  border-radius: 9px;
  background: #ffffff70;
  text-align: left;
  color: #6c8190;
  font-size: 15px;
  cursor: pointer;
}
.workflow-steps button span {
  color: #5383db;
  font-size: 14px;
}
.workflow-steps button.selected {
  border-color: #3b74e2;
  box-shadow: inset 0 0 0 1px #3b74e2;
  color: #234d9d;
}
.copy-feedback {
  margin: 28px 0 18px;
  border: 1px solid #d5e0e9;
  border-radius: 12px;
  background: #ffffff60;
  padding: 24px 20px;
  text-align: center;
  color: #748e9e;
}
.copy-feedback svg {
  margin: 0 auto 8px;
  color: #4e89e5;
}
.copy-feedback strong {
  display: block;
  font-size: 16px;
}
.copy-feedback p {
  font-size: 12px;
  margin: 8px 0 0;
  line-height: 1.7;
}
.copy-feedback.success {
  border-color: #b9d0f0;
  background: #f8fbff;
  color: #234c78;
}
.workflow-replay,
.workflow-partner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 46px;
  width: 100%;
  border: 1px solid #84a5d6;
  border-radius: 8px;
  background: none;
  color: #497fcf;
  font-size: 13px;
  cursor: pointer;
}
.workflow-partner {
  background: #3269d4;
  color: white;
  border-color: #3269d4;
  margin: 0 0 12px;
}
.workflow-disclaimer {
  font-size: 10px !important;
  line-height: 1.9;
  color: #95a4ae !important;
  margin-top: 24px;
}
.export-shell .detail-layout,
.export-shell .wallet-page {
  scroll-margin-top: 20px;
}
.export-shell input.coupon-code {
  font-size: 16px;
}
.export-content:not(.mode-interaction) .detail-page input.coupon-code {
  font-size: 20px;
}
@media (max-width: 760px) {
  .export-toolbar {
    padding: 0 14px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .export-kicker small {
    display: none;
  }
  .export-tabs {
    gap: 12px;
  }
  .export-tabs button {
    font-size: 10px;
    letter-spacing: 0.5px;
  }
  .export-reset span {
    display: none;
  }
  .export-content {
    padding: 12px;
  }
  .workflow {
    gap: 24px;
    flex-direction: column;
    align-items: center;
  }
  .workflow-phone {
    flex: none;
    width: 390px !important;
  }
  .workflow-inspector {
    max-width: 430px;
    width: 100%;
    padding: 6px 12px 14px;
  }
  .workflow-inspector h2 {
    font-size: 24px;
  }
  .workflow-inspector h2 br {
    display: none;
  }
  .workflow-inspector > p br {
    display: none;
  }
  .workflow-steps {
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 18px;
  }
  .workflow-steps button {
    padding: 10px 8px;
    gap: 7px;
    font-size: 11px;
    min-height: 48px;
  }
  .workflow-steps button span {
    font-size: 10px;
  }
  .copy-feedback {
    margin-top: 18px;
  }
  .export-caption {
    padding: 14px;
    gap: 8px;
    font-size: 9px;
  }
  .export-mobile .page-container {
    padding-left: 14px !important;
    padding-right: 14px !important;
  }
  .export-shell .culture-logo img {
    width: 130px;
  }
  .mode-mobile.is-detail .export-header-back {
    left: 4px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0s !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

.prototype-dialog {
  position: fixed;
  margin: auto;
  max-width: min(480px, calc(100vw - 32px));
  width: 100%;
  border: 0;
  border-radius: 20px;
  padding: 0;
  background: #fff;
  box-shadow: 0 20px 70px #24314740;
}
.prototype-dialog::backdrop {
  background: #18293a66;
}
.prototype-dialog-body {
  position: relative;
  padding: 28px;
}
.prototype-dialog-close {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 44px;
  height: 44px;
  border: 0;
  background: none;
  font-size: 25px;
  color: #86729c;
  cursor: pointer;
}
.prototype-dialog h2 {
  font-size: 24px;
  margin-bottom: 8px;
  color: #352344;
}
.prototype-dialog-body > p {
  font-size: 13px;
  color: #9a8cab;
  margin-bottom: 24px;
}
.prototype-dialog .primary-button {
  width: 100%;
  margin-top: 22px;
}
